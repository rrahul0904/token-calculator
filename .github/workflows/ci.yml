name: CI

on:
  push:
    branches: [main, implementation-v1, observability-control-research, production-wave-2-agent-economics, production-wave-3-full-connectivity]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Drizzle schema check
        run: npm run db:check
      - name: Production build
        run: npm run build
