name: Token portfolio lock refresh

# This workflow intentionally self-triggers when its definition changes so a
# manifest/lock mismatch can be repaired on the protected feature branch.
on:
  workflow_dispatch:
  push:
    branches:
      - codex/token-saving-portfolio-20261006
    paths:
      - .github/workflows/token-portfolio-lock-refresh.yml
      - package.json

permissions:
  contents: write

concurrency:
  group: token-portfolio-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'rrahul0904/token-calculator' && github.ref == 'refs/heads/codex/token-saving-portfolio-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/token-saving-portfolio-20261006
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Refresh bounded vulnerable dependencies in the lockfile
        run: npm update sharp source-map-js next eslint-config-next --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refuse package manifest changes
        run: |
          if ! git diff --quiet -- package.json; then
            echo 'package.json changed; refusing automated lock refresh.' >&2
            git diff -- package.json
            exit 1
          fi
      - name: Verify production vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - name: Verify lockfile installs cleanly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require a bounded lockfile-only diff
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo 'No lockfile change required.'
            exit 0
          fi
          if [ "$changed" != "package-lock.json" ]; then
            echo 'Unexpected files changed; refusing commit.' >&2
            exit 1
          fi
          git diff --stat -- package-lock.json
      - name: Commit verified lockfile refresh
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix: refresh vulnerable production dependencies'
          git push origin HEAD:codex/token-saving-portfolio-20261006
