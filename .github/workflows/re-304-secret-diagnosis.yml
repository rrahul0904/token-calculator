name: RE-304 secret-scan metadata diagnosis
on:
  pull_request:
    paths:
      - 'apps/route-gateway-pilot/**'
      - '.github/workflows/route-gateway-pilot.yml'
      - '.github/workflows/re-304-secret-diagnosis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect rule and location only (never print secret or match)
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.24.3 detect --source=/repo --config=/repo/.gitleaks.toml --redact --exit-code=0 --log-opts="--all" --report-format=json --report-path=/repo/.tmp-gitleaks-metadata.json
          node <<'NODE'
          const fs=require('node:fs');
          const path='.tmp-gitleaks-metadata.json';
          try {
            const rows=JSON.parse(fs.readFileSync(path,'utf8'));
            for(const row of rows) {
              console.log(JSON.stringify({rule:row.RuleID,file:row.File,line:row.StartLine,commit:String(row.Commit||'').slice(0,12)}));
            }
            console.log('Finding count: '+rows.length);
          } finally { fs.rmSync(path,{force:true}); }
          NODE
