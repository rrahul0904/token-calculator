name: Security lockfile regeneration (PR branch only)
on:
  push:
    branches:
      - security/launch-wave1-dependency-remediation-20261028
permissions:
  contents: write
concurrency:
  group: launch-security-lockfile
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'rrahul0904/token-calculator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate transitive lock without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lock metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json'));
          const l = JSON.parse(fs.readFileSync('package-lock.json'));
          for (const [name, version] of Object.entries(p.dependencies)) {
            if (l.packages[''].dependencies[name] !== version) throw new Error('lock-mismatch:' + name);
          }
          for (const [name, version] of Object.entries(p.devDependencies)) {
            if (l.packages[''].devDependencies[name] !== version) throw new Error('lock-dev-mismatch:' + name);
          }
          NODE
      - name: Commit lockfile to the same protected review branch only
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore(security): regenerate transitive dependency lockfile"
          git push origin "HEAD:refs/heads/security/launch-wave1-dependency-remediation-20261028"
