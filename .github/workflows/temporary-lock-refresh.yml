name: Temporary dependency lock refresh

on:
  push:
    branches:
      - fix/token-intelligence-ci-gates-20261001
    paths:
      - .github/workflows/temporary-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/token-intelligence-ci-gates-20261001
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate patched Next.js lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact next@16.3.6 eslint-config-next@16.3.6
      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "fix: upgrade Next.js to patched 16.3.6"
          git push origin HEAD:fix/token-intelligence-ci-gates-20261001
