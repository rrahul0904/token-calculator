name: Route gateway pilot
on:
  pull_request:
    paths:
      - 'apps/route-gateway-pilot/**'
      - '.github/workflows/route-gateway-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'apps/route-gateway-pilot/**'
      - '.github/workflows/route-gateway-pilot.yml'
  workflow_dispatch:
jobs:
  gateway-pilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/route-gateway-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: docker build -t token-intelligence-gateway-pilot .
