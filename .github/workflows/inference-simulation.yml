name: Inference Simulation — Focused Checks

on:
  pull_request:
    paths:
      - "src/lib/inference/**"
      - "src/app/api/v1/inference-simulations/**"
      - "tests/inference-simulations*.test.ts"
      - ".github/workflows/inference-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Contract + types + access controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type-check all application code
        run: npm run typecheck
      - name: Gateway-focused tests
        run: npx vitest run tests/inference-simulations.test.ts tests/inference-simulations-route.test.ts
      - name: Security disclaimer
        run: |
          echo "Focused checks do NOT waive the repository-wide npm audit requirement."
          echo "The separate CI dependency vulnerability gate must pass before release."
