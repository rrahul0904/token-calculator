name: Inference Gateway — Focused Simulated and Live Provider Checks

on:
  pull_request:
    paths:
      - "src/lib/inference/**"
      - "src/app/api/v1/inference-simulations/**"
      - "src/app/api/v1/inference/**"
      - "tests/inference-simulations*.test.ts"
      - "tests/inference-live*.test.ts"
      - ".github/workflows/inference-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Contract, PostgreSQL, types and access controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/token_intelligence
      DATABASE_SSL: disable
      TOKEN_INTELLIGENCE_INTEGRATION_TESTS: "1"
      INFERENCE_SIMULATION_ENABLED: "1"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: token_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d token_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type-check all application code
        run: npm run typecheck
      - name: Apply existing PostgreSQL migrations
        run: npm run db:migrate
      - name: Gateway-focused unit, HTTP, and database acceptance
        run: npx vitest run tests/inference-simulations.test.ts tests/inference-simulations-route.test.ts tests/inference-simulations-db.test.ts tests/inference-live.test.ts tests/inference-live-db.test.ts
      - name: Security disclaimer
        run: |
          echo "Focused acceptance does NOT waive repository-wide npm audit or commercial billing certification."
          echo "Critical/high dependency findings are tracked in Issue #80."
