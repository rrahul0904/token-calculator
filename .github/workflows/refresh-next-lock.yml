name: Verify current dependency security

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/refresh-next-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify current Next versions are aligned
        run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.dependencies.next!==l.packages[''].dependencies.next||p.devDependencies['eslint-config-next']!==l.packages[''].devDependencies['eslint-config-next']) process.exit(1); console.log('next='+p.dependencies.next+' eslint-config-next='+p.devDependencies['eslint-config-next'])"
      - name: Verify clean install from committed lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify production high-severity audit
        run: npm audit --omit=dev --audit-level=high
