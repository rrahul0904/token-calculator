name: Refresh Next security lock

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/refresh-next-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate patched package manifest and lockfile
        run: npm install next@16.3.8 eslint-config-next@16.3.8 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched versions
        run: node -e "const p=require('./package.json'); if(p.dependencies.next!=='16.3.8'||p.devDependencies['eslint-config-next']!=='16.3.8') process.exit(1)"
      - name: Verify clean install from generated lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify production high-severity audit
        run: npm audit --omit=dev --audit-level=high
      - name: Upload verified manifests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: next-16.3.8-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
